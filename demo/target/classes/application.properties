# O nome lógico da aplicação, útil para identificação em logs e ferramentas.
spring.application.name=projeto1
# O banco indicado na URL deve existir no SQL Server; esta configuração não o cria.
# Mantém a sessão JPA aberta durante a requisição web, permitindo consultas tardias na serialização.
spring.jpa.open-in-view=true

# Configurações do banco de dados SQL Server
# URL JDBC com servidor, porta e banco de dados. trustServerCertificate confia no certificado apresentado.
spring.datasource.url=jdbc:sqlserver://F121-LB5-N14:1433;databaseName=bdprovateste;encrypt=true;trustServerCertificate=true;
# Driver JDBC usado para conversar com o SQL Server.
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=aluno
spring.datasource.password=dba
# Dialeto que orienta o Hibernate a gerar SQL compatível com SQL Server.
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# ATENÇÃO: cria as tabelas ao iniciar e as apaga ao encerrar; somente para banco descartável/de teste.
spring.jpa.hibernate.ddl-auto=create-drop

# Se você também estiver servindo páginas web, pode querer configurar o filtro de codificação de caracteres
# Define UTF-8 para os dados de texto trafegados pela aplicação.
spring.servlet.encoding.charset=UTF-8
# Força o filtro Servlet a aplicar a codificação configurada.
spring.servlet.encoding.force=true